version: '3.8'
services:
  pos-management:
    build:
      context: "./POS Management System"
      dockerfile: Dockerfile
    image: pos-management:latest
    container_name: pos-management
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Override connection string to use SQLite inside container and persist file under mounted volume
      - ConnectionStrings__DefaultConnection=Data Source=/app/Data/pos.db
    networks:
      - webnet
    volumes:
      - ./"POS Management System"/Data:/app/Data
    depends_on:
      - migrate
    restart: unless-stopped

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: pos-migrate
    working_dir: /src
    volumes:
      - ./:/src
    entrypoint: ["bash","-c","cd 'POS Management System' && dotnet restore && dotnet build -c Release && dotnet ef database update --project 'POS Management System' --startup-project 'POS Management System' || true"]
    networks:
      - webnet
    restart: "no"

  sqlite:
    image: nouchka/sqlite3:latest
    container_name: pos-sqlite
    # This container just provides a writable directory for the SQLite file; the app can mount the same path.
    volumes:
      - ./POS Management System/Data:/data
    networks:
      - webnet
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pos-management
    links:
      - pos-management
    networks:
      - webnet
    restart: unless-stopped

volumes:
  # Keep existing named volumes here if you still use sqlserver in other environments
  dbdata:
